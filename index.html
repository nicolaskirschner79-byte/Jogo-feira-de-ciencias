function initialAngle(v){return typeof v==='number'?normalizedAngle(v):v===true?90:0}
function trace(level,states){
 let [px,py]=level.emitter,[dx,dy]=({right:[1,0],left:[-1,0],up:[0,-1],down:[0,1]})[level.direction];
 const points=[[px,py]],seen=new Set();
 for(let i=0;i<95;i++){
  if(px===level.receiver[0]&&py===level.receiver[1])return {points,hit:true,blocked:false};
  const idx=level.mirrors.findIndex(q=>q[0]===px&&q[1]===py);
  if(idx!==-1){
   const angle=initialAngle(states[idx]);
   if(angle%90!==0)return {points,hit:false,blocked:true};
   [dx,dy]=angle%180===90?[-dy,-dx]:[dy,dx];
  }
  const k=[px,py,dx,dy].join(':');if(seen.has(k))break;seen.add(k);
  px+=dx;py+=dy;points.push([px,py]);
  if(px<0||px>10||py<0||py>6)break;
 }
 return {points,hit:false,blocked:false};
}
// Sintetizador reutilizável: efeitos mais presentes, sem picos agressivos ou cortes abruptos.
let audioEngine=null;
function beep(freq=650,kind='ui'){
 if(!sound)return;
 try{
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context)return;
  if(!audioEngine||audioEngine.ctx.state==='closed'){
   const ctx=new Context(),master=ctx.createGain(),limiter=ctx.createDynamicsCompressor();
   limiter.threshold.value=-15;limiter.knee.value=16;limiter.ratio.value=8;
   limiter.attack.value=.004;limiter.release.value=.19;
   master.gain.value=.87;master.connect(limiter);limiter.connect(ctx.destination);
   audioEngine={ctx,master};
  }
  const {ctx,master}=audioEngine;
  if(ctx.state==='suspended')void ctx.resume();
  const t=ctx.currentTime,length=kind==='success'?.29:kind==='start'?.22:.19;
  const voice=ctx.createGain(),low=ctx.createOscillator(),warm=ctx.createOscillator();
  low.type='sine';warm.type='triangle';low.frequency.setValueAtTime(freq,t);
  low.frequency.exponentialRampToValueAtTime(freq*(kind==='success'?1.3:1.07),t+length);
  warm.frequency.value=freq*1.5;
  voice.gain.setValueAtTime(.0001,t);
  voice.gain.exponentialRampToValueAtTime(kind==='success'?.17:.135,t+.013);
  voice.gain.exponentialRampToValueAtTime(.0001,t+length);
  const harmonic=ctx.createGain();harmonic.gain.value=.22;
  low.connect(voice);warm.connect(harmonic);harmonic.connect(voice);voice.connect(master);
  low.start(t);warm.start(t);low.stop(t+length+.01);warm.stop(t+length+.01);
  low.onended=()=>{low.disconnect();warm.disconnect();harmonic.disconnect();voice.disconnect()};
 }catch{/* Sem áudio não impede jogar. */}
}

function canvasPoint(event,canvas){const r=canvas.getBoundingClientRect(),aspect=1000/450,ratio=r.width/r.height;
 const w=ratio>aspect?r.height*aspect:r.width,h=ratio>aspect?r.height:r.width/aspect;
 const left=r.left+(r.width-w)/2,top=r.top+(r.height-h)/2;
 return {x:(event.clientX-left)*1000/w,y:(event.clientY-top)*450/h};}

const ease=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};
function syncVisual(){

 // O índice do circuito é sempre o número da fase menos um.

 if(visual.stage===sceneKey)return;
 const level=active&&Number.isInteger(active.stage)?currentLevels()[active.stage-1]:null;
 visual={stage:sceneKey,angles:level?level.mirrors.map((m,i)=>({from:mirrors[i]??initialAngle(m[2]),to:mirrors[i]??initialAngle(m[2]),start:0})):[],beamFrom:null,beamTo:level?trace(level,mirrors):null,beamAt:performance.now()-400,enteredAt:performance.now()};
}
function rotateMirror(i,steps=1){
 if(!active||i<0||i>=mirrors.length||!Number.isInteger(steps)||steps===0)return;
 syncVisual();
 const now=performance.now(),a=visual.angles[i],progress=prefersReduced.matches?1:ease((now-a.start)/300);
 const current=a.from+(a.to-a.from)*progress;
 visual.beamFrom=visual.beamTo;
 mirrors[i]=normalizedAngle(mirrors[i]+steps*45);
 visual.angles[i]={from:current,to:a.to+steps*45,start:now};
 visual.beamTo=trace(currentLevels()[active.stage-1],mirrors);
 visual.beamAt=now;
 beep(540,'mirror');renderControls();
}
function setMirrorAngle(i,desired){
 if(!active||!Number.isInteger(desired)||desired%45!==0)return;
 const current=normalizedAngle(mirrors[i]),target=normalizedAngle(desired);
 if(current===target)return;
 let diff=((target-current+540)%360)-180;if(diff===-180)diff=180;
 rotateMirror(i,diff/45);
}
let animation=0;
function drawLoop(){
 cancelAnimationFrame(animation);
 const canvas=document.getElementById('gameboard');if(!canvas||!active)return;
 syncVisual();let drag=null;
 const center=m=>({x:180+m[0]*61,y:43+m[1]*61});
 canvas.style.touchAction='none';
 canvas.addEventListener('pointerdown',event=>{
  const pt=canvasPoint(event,canvas),list=currentLevels()[active.stage-1].mirrors;
  const i=list.findIndex(m=>{const q=center(m);return Math.hypot(pt.x-q.x,pt.y-q.y)<34});
  if(i<0)return;
  event.preventDefault();const pivot=center(list[i]);
  drag={i,pivot,origin:Math.atan2(pt.y-pivot.y,pt.x-pivot.x),previous:null,accumulated:0,start:mirrors[i],pt,moved:false};
  if(canvas.setPointerCapture)canvas.setPointerCapture(event.pointerId);
 });
 canvas.addEventListener('pointermove',event=>{
  if(!drag)return;const pt=canvasPoint(event,canvas);
  if(!drag.moved&&Math.hypot(pt.x-drag.pt.x,pt.y-drag.pt.y)>11)drag.moved=true;
  if(!drag.moved)return;event.preventDefault();
  const angle=Math.atan2(pt.y-drag.pivot.y,pt.x-drag.pivot.x);
  if(drag.previous===null)drag.previous=drag.origin;
  let delta=angle-drag.previous;
  if(delta>Math.PI)delta-=2*Math.PI;
  if(delta<-Math.PI)delta+=2*Math.PI;
  drag.accumulated+=delta;drag.previous=angle;
  setMirrorAngle(drag.i,drag.start+Math.round(drag.accumulated*180/Math.PI/45)*45);
 });
 canvas.addEventListener('pointerup',event=>{
  if(!drag)return;event.preventDefault();
  if(!drag.moved)rotateMirror(drag.i,1);
  drag=null;
 });
 canvas.addEventListener('pointercancel',()=>{drag=null});
 const ctx=canvas.getContext('2d',{alpha:false,desynchronized:true})||canvas.getContext('2d');
 if(!ctx)return;
 // Limitamos redesenhos de 60+ para cerca de 30 FPS no PC e 24 no celular.
 // O relógio permanece independente dessa taxa.
 let lastFrame=0,frameErrors=0;
 const minimumFrameTime=window.matchMedia('(max-width:760px)').matches?1000/24:1000/30;
 function frame(t){
  if(!canvas.isConnected||view!=='game'||!active)return;
  animation=requestAnimationFrame(frame);
  if(document.hidden||t-lastFrame<minimumFrameTime)return;
  lastFrame=t;
  try{
   draw(ctx,t/1000);
   frameErrors=0;
  }catch(err){
   // Um erro gráfico não deve impedir os próximos quadros nem ocultar o tabuleiro.
   if(frameErrors++===0)console.error('LIGO: falha ao desenhar o tabuleiro',err);
  }
 }
 animation=requestAnimationFrame(frame);
}
function line(ctx,coords,width,color){ctx.beginPath();coords.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke();}
function drawBeam(ctx,path,alpha,t){
 if(!path||alpha<=.001)return;
 const points=path.points.map(pt=>[180+pt[0]*61,43+pt[1]*61]);
 ctx.save();ctx.globalAlpha=alpha;
 line(ctx,points,19,'rgba(31,167,230,.10)');
 line(ctx,points,9,'rgba(34,211,238,.30)');
 line(ctx,points,3,'#b6f4ff');
 ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
 ctx.strokeStyle='rgba(200,250,255,.24)';ctx.lineWidth=1.5;ctx.setLineDash([13,23]);ctx.lineDashOffset=-t*23;ctx.stroke();ctx.setLineDash([]);
 ctx.restore();
}
function draw(ctx,t){
 syncVisual();
 const now=t*1000,reduced=prefersReduced.matches;
 ctx.clearRect(0,0,1000,450);
 ctx.save();ctx.globalAlpha=reduced?1:ease((now-visual.enteredAt)/520);
 ctx.fillStyle='#0a1528';ctx.fillRect(0,0,1000,450);
 ctx.strokeStyle='rgba(61,113,154,.14)';ctx.lineWidth=1;
 for(let i=20;i<1000;i+=39){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,450);ctx.stroke();}
 for(let j=20;j<450;j+=39){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(1000,j);ctx.stroke();}
 ctx.strokeStyle='#32516e';ctx.strokeRect(12,12,976,426);
 const q=currentLevels()[active.stage-1],c=[180,43],sz=61,rx=c[0]+q.receiver[0]*sz,ry=c[1]+q.receiver[1]*sz;
 const success=visual.beamTo?.hit;
 const pulse=reduced?0:(.5+.5*Math.sin(t*2.5));
 ctx.fillStyle=success?`rgba(36,210,156,${.16+.07*pulse})`:'rgba(33,130,141,.13)';
 ctx.beginPath();ctx.arc(rx,ry,27+(reduced?0:2*pulse),0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#103b4c';ctx.beginPath();ctx.arc(rx,ry,20,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle=success?'#32f5b9':'#67d0ce';ctx.lineWidth=4;ctx.stroke();
 ctx.strokeStyle='#d2fff7';ctx.lineWidth=1;ctx.beginPath();ctx.arc(rx,ry,11,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#32d8b4';ctx.beginPath();ctx.arc(rx,ry,5,0,Math.PI*2);ctx.fill();
 const fade=reduced?1:ease((now-visual.beamAt)/380);
 if(visual.beamFrom&&fade<1)drawBeam(ctx,visual.beamFrom,1-fade,t);
 drawBeam(ctx,visual.beamTo,fade,t);
 if(visual.beamTo?.blocked){const last=visual.beamTo.points.at(-1),bx=c[0]+last[0]*sz,by=c[1]+last[1]*sz;ctx.fillStyle='rgba(251,191,36,.35)';ctx.beginPath();ctx.arc(bx,by,10,0,Math.PI*2);ctx.fill();}
 q.mirrors.forEach((m,i)=>{
  const [px,py]=[c[0]+m[0]*sz,c[1]+m[1]*sz],a=visual.angles[i];
  const angle=reduced?a.to:a.from+(a.to-a.from)*ease((now-a.start)/300);
  if(mirrorArt.complete&&mirrorArt.naturalWidth){ctx.save();ctx.translate(px,py);ctx.rotate(angle*Math.PI/180);ctx.drawImage(mirrorArt,-29,-29,58,58);ctx.restore();}
  else{ctx.fillStyle='#467995';ctx.beginPath();ctx.arc(px,py,24,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#dffaff';ctx.font='bold 11px Arial';ctx.fillText('E'+(i+1),px+15,py+25);
 });
 const ex=c[0]+q.emitter[0]*sz,ey=c[1]+q.emitter[1]*sz;
 ctx.fillStyle='#143b58';ctx.beginPath();ctx.arc(ex,ey,21,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#7ad9ff';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#b9f6ff';ctx.beginPath();ctx.arc(ex,ey,8+(reduced?0:1.2*Math.sin(t*2.5)),0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function go(dest){if(dest==='home'&&active)resetVisitor();view=dest;render();if(dest==='ranking')void refreshRanking()}
async function action(type,e){if(type==='mobile-menu'){document.querySelector('.nav-links')?.classList.toggle('open');return;}if(type==='home'||type==='ranking'||type==='science'){hideModal();go(type);return}
 if(type==='play'){resetVisitor();showModal('register');return}
 if(type==='settings'){showModal('settings');return}if(type==='close'){hideModal();return}
 if(type==='theme'){theme=theme==='dark'?'light':'dark';store.setItem('ligo_theme',theme);document.documentElement.dataset.theme=theme;showModal('settings');return}
 if(type==='sound'){sound=!sound;store.setItem('ligo_sound',String(sound));showModal('settings');beep();return}
 if(type==='select-difficulty'){
   const level=e.target.closest('[data-level]')?.dataset.level;
   if(!Object.hasOwn(DIFFICULTY_LABELS,level))return;
   selectedDifficulty=level;
   document.querySelectorAll('.difficulty-choice').forEach(btn=>{const on=btn.dataset.level===level;btn.classList.toggle('selected',on);btn.setAttribute('aria-checked',String(on))});
   return;
 }
 if(type==='save-player'){
   if(busy)return;
   const first=document.getElementById('first-name')?.value.normalize('NFC').trim().replace(/\s+/g,' ')||'';
   const last=document.getElementById('last-name')?.value.normalize('NFC').trim().replace(/\s+/g,' ')||'';
   const regex=/^[\p{L}][\p{L}'-]*(?: [\p{L}][\p{L}'-]*)*$/u;
   const error=document.getElementById('modal-error');
   if(first.length<2||first.length>35||last.length<2||last.length>45||first.length+last.length+1>80||!regex.test(first)||!regex.test(last)){
     error.textContent='Preencha nome e sobrenome com pelo menos duas letras em cada campo.';return;
   }
   busy=true;const entry=preparePlayerToken(first+' '+last);playerToken=entry.token;
   try{const d=await api('register',{first_name:first,last_name:last});player=d.player.nickname;rememberPlayer(player,entry.token);rankDifficulty=selectedDifficulty;showModal('tutorial')}
   catch(e){playerToken='';if(error)error.textContent=errorLabel(e)}
   finally{busy=false}
   return;
 }
 if(type==='begin'){void begin();return}
 if(type==='restart'){resetVisitor();showModal('register');return}
 if(type==='refresh-ranking'){void refreshRanking();return}
 if(type==='rank-level'){const level=e.target.closest('[data-level]')?.dataset.level;if(Object.hasOwn(DIFFICULTY_LABELS,level)&&rankDifficulty!==level){rankDifficulty=level;board={ranking:[],me:null};rankingError='Carregando...';render();void refreshRanking()}return}
 if(!active)return;
 if(type==='mirror'){const btn=e.target.closest('button'),i=Number(btn?.dataset.i),step=Number(btn?.dataset.step||1);if(Number.isInteger(i)&&Number.isInteger(step))rotateMirror(i,step);return}
 if(type==='confirm') {if(trace(currentLevels()[active.stage-1],mirrors).hit)void advanceStage();}

}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button)action(button.dataset.action,e)});
setInterval(()=>{if(view==='game'&&active){const timer=document.getElementById('timer');if(timer)timer.textContent=format(Date.now()-active.startedAt)}},160);
setInterval(()=>{if(view==='ranking')void refreshRanking()},12000);
render();
// Sem restauração automática: cada nova partida solicita identificação.

</script></body></html>
