function seededRandom(seed){let s=seed>>>0||123456789;return ()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296}}
function createPuzzle(stage,seed){
 const rng=seededRandom(seed),step=[[1,0],[0,1],[-1,0],[0,-1]],dirs=['right','down','left','up'];
 const count=stage<=3?stage+1:stage;
 for(let attempt=0;attempt<80000;attempt++){
  let x=1+Math.floor(rng()*9),y=1+Math.floor(rng()*5),dir=Math.floor(rng()*4);
  const emitter=[x,y],initial=dir,seen=new Set([x+','+y]),mirrors=[],sol=[];
  let valid=true;
  for(let m=0;m<count;m++){
   const n=2+Math.floor(rng()*3),[dx,dy]=step[dir];
   for(let j=0;j<n;j++){x+=dx;y+=dy;const k=x+','+y;if(x<0||x>10||y<0||y>6||seen.has(k)){valid=false;break}seen.add(k)}
   if(!valid)break;
   const next=(dir+(rng()<.5?1:3))%4;
   const slash=step[next][0]===-step[dir][1]&&step[next][1]===-step[dir][0];
   mirrors.push([x,y,rng()<.5]);sol.push(slash);dir=next;
  }
  if(!valid)continue;
  const n=1+Math.floor(rng()*3),[dx,dy]=step[dir];
  for(let j=0;j<n;j++){x+=dx;y+=dy;const k=x+','+y;if(x<0||x>10||y<0||y>6||seen.has(k)){valid=false;break}seen.add(k)}
  if(!valid)continue;
  const level={title:'Circuito '+stage,emitter,receiver:[x,y],direction:dirs[initial],mirrors,solution:sol};
  let wins=0;for(let mask=0;mask<(1<<count);mask++){const s=mirrors.map((_,i)=>Boolean(mask&(1<<i)));if(trace(level,s).hit)wins++}
  if(wins===1&&!mirrors.every((m,i)=>m[2]===sol[i]))return level;
 }
 throw Error('Circuito indisponível');
}
function freshLevels(){return Array.from({length:5},(_,i)=>createPuzzle(i+1,crypto.getRandomValues(new Uint32Array(1))[0]))}

function format(ms){let m=Math.max(0,Math.floor(ms));return String(Math.floor(m/60000)).padStart(2,'0')+':'+String(Math.floor(m/1000)%60).padStart(2,'0')+'.'+String(m%1000).padStart(3,'0');}
function initialAngle(value){return value===true?90:0}
function trace(level,states){
 let [px,py]=level.emitter,[dx,dy]=({right:[1,0],left:[-1,0],up:[0,-1],down:[0,1]})[level.direction];
 const points=[[px,py]],seen=new Set();
 for(let i=0;i<95;i++){
  if(px===level.receiver[0]&&py===level.receiver[1])return {points,hit:true};
  const idx=level.mirrors.findIndex(m=>m[0]===px&&m[1]===py);
  if(idx!==-1)[dx,dy]=states[idx]?[-dy,-dx]:[dy,dx];
  const key=[px,py,dx,dy].join(':');if(seen.has(key))break;seen.add(key);
  px+=dx;py+=dy;points.push([px,py]);
  if(px<0||px>10||py<0||py>6)break;
 }
 return {points,hit:false};
}

let audioEngine=null;
function beep(freq=650,kind='ui'){
 if(!sound)return;
 try{
  const Context=window.AudioContext||window.webkitAudioContext;
  if(!Context)return;
  if(!audioEngine||audioEngine.ctx.state==='closed'){
   const ctx=new Context(),master=ctx.createGain(),limiter=ctx.createDynamicsCompressor();
   limiter.threshold.value=-15;limiter.knee.value=16;limiter.ratio.value=8;
   limiter.attack.value=.004;limiter.release.value=.19;
   master.gain.value=.87;master.connect(limiter);limiter.connect(ctx.destination);
   audioEngine={ctx,master};
  }
  const {ctx,master}=audioEngine;
  if(ctx.state==='suspended')void ctx.resume();
  const t=ctx.currentTime,length=kind==='success'?.29:kind==='start'?.22:.19;
  const voice=ctx.createGain(),low=ctx.createOscillator(),warm=ctx.createOscillator();
  low.type='sine';warm.type='triangle';low.frequency.setValueAtTime(freq,t);
  low.frequency.exponentialRampToValueAtTime(freq*(kind==='success'?1.3:1.07),t+length);
  warm.frequency.value=freq*1.5;
  voice.gain.setValueAtTime(.0001,t);
  voice.gain.exponentialRampToValueAtTime(kind==='success'?.17:.135,t+.013);
  voice.gain.exponentialRampToValueAtTime(.0001,t+length);
  const harmonic=ctx.createGain();harmonic.gain.value=.22;
  low.connect(voice);warm.connect(harmonic);harmonic.connect(voice);voice.connect(master);
  low.start(t);warm.start(t);low.stop(t+length+.01);warm.stop(t+length+.01);
  low.onended=()=>{low.disconnect();warm.disconnect();harmonic.disconnect();voice.disconnect()};
 }catch{/* Sem áudio não impede jogar. */}

 <section class="stellar-intro" id="sci-gabriela" aria-labelledby="stellar-intro-title">
   <div class="stellar-intro-side"><div class="stellar-section-index">01 <span>—</span> A CIENTISTA</div><div class="stellar-intro-side-graphic" aria-hidden="true">✳</div><p>UMA HISTÓRIA DE CURIOSIDADE, PERSISTÊNCIA E PRECISÃO.</p></div>
   <div class="stellar-intro-main"><div class="stellar-eyebrow">CONHEÇA GABRIELA</div><h2 id="stellar-intro-title">A física que se dedicou a <em>medir o quase impossível.</em></h2><p>Gabriela González nasceu em Córdoba, na Argentina. Estudou Física na Universidade Nacional de Córdoba e, depois, seguiu para os Estados Unidos, onde concluiu seu doutorado na Syracuse University em 1995.</p><p>Na Louisiana State University, sua pesquisa concentra-se em tornar detectores de ondas gravitacionais mais sensíveis e confiáveis. Ela estuda fontes de ruído, calibração e análise dos sinais coletados pelo LIGO.</p><div class="stellar-pullquote"><span>✦</span><p>Uma descoberta dessa dimensão não é obra de uma pessoa: nasce da colaboração de pesquisadores e da precisão de cada experimento.</p></div><a class="stellar-source-link" href="https://www.lsu.edu/physics/people/faculty/gonzalez.php" target="_blank" rel="noopener noreferrer">SUA BIOGRAFIA NA LSU <span>↗</span></a></div>

   <div class="stellar-ligo-copy"><div class="stellar-eyebrow"><span class="stellar-number">03</span> O PROJETO QUE MUDOU TUDO</div><h2 id="stellar-ligo-title">LIGO.<br><em>Quando a luz encontra o espaço-tempo.</em></h2><p>O <strong>Laser Interferometer Gravitational-Wave Observatory</strong> usa feixes de laser e espelhos para medir deformações minúsculas no espaço-tempo, provocadas por ondas gravitacionais.</p><p>São dois grandes observatórios, em Livingston e Hanford, nos Estados Unidos. Seus braços em formato de L têm 4 quilômetros de comprimento.</p><a href="https://www.ligo.caltech.edu/page/what-is-ligo" class="stellar-source-link" target="_blank" rel="noopener noreferrer">EXPLORAR O SITE OFICIAL DO LIGO <span>↗</span></a><div class="stellar-ligo-metrics"><div><strong>02</strong><span>OBSERVATÓRIOS</span></div><div><strong>4 <small>km</small></strong><span>POR BRAÇO</span></div><div><strong>2015</strong><span>1ª DETECÇÃO</span></div></div></div>

function hideModal(){modal='';modalRoot.innerHTML=''}
async function begin(){if(busy)return;busy=true;hideModal();try{const d=await api('start',{fresh:true,difficulty:selectedDifficulty});active={id:d.run_id,stage:d.stage,difficulty:d.difficulty,startedAt:Date.parse(d.started_at),levels:Array.from({length:5},(_,i)=>i===d.stage-1?d.puzzle:null)};resetStage();view='game';beep(780,'start');render()}catch(e){alert(errorLabel(e));view='home';render()}finally{busy=false}}
function resetStage(){mirrors=currentLevels()[(active?.stage||1)-1].mirrors.map(q=>typeof q[2]==='boolean'?q[2]:Number(q[2])%180===90);visual.stage='';}
async function advanceStage(){if(busy||!active)return;busy=true;try{const d=await api('submit',{run_id:active.id,states:mirrors});beep(880,'success');if(d.finished){board={ranking:d.ranking||[],me:d.me};result={duration_ms:d.duration_ms,position:d.me?.position,difficulty:d.difficulty};rankDifficulty=d.difficulty;active=null;view='results';render()}else{active.stage=d.stage;active.levels[d.stage-1]=d.puzzle;resetStage();render()}}catch(e){alert(errorLabel(e))}finally{busy=false}}
function renderControls(){
 const container=document.getElementById('controls');if(!container||!active)return;
 const hit=trace(currentLevels()[active.stage-1],mirrors).hit;
 const buttons=mirrors.map((value,i)=>'<button class="mirror-control" data-action="mirror" data-i="'+i+'" aria-label="Girar espelho '+(i+1)+'">↻ E'+(i+1)+' <strong>'+(value?'/':'\\')+'</strong></button>').join('');
 const main='<div class="control-title">◎ ORIENTAÇÃO DOS ESPELHOS</div>'+
  '<p class="small-muted">Toque no espelho ou no botão para alternar entre as duas diagonais.</p>'+
  '<div class="mirror-controls">'+buttons+'</div>';
 const side='<div class="objective-state '+(hit?'good':'')+'"><span>'+(hit?'✓':'◎')+'</span>'+
  '<div><strong>'+(hit?'Receptor ativado!':'Encontre o caminho')+'</strong>'+
  '<small>'+(hit?'Feixe alinhado: pode avançar.':'Gire os espelhos para atingir o receptor.')+'</small></div></div>'+
  '<button class="btn btn-primary" data-action="confirm" '+(hit?'':'disabled')+'>'+
  (active.stage===5?'CONCLUIR MISSÃO':'PRÓXIMA FASE')+' →</button>';
 container.innerHTML='<div class="control-grid"><div class="control-main">'+main+'</div><div class="control-action">'+side+'</div></div>';
}
function canvasPoint(event,canvas){const r=canvas.getBoundingClientRect(),aspect=1000/450,ratio=r.width/r.height;
 const w=ratio>aspect?r.height*aspect:r.width,h=ratio>aspect?r.height:r.width/aspect;
 const left=r.left+(r.width-w)/2,top=r.top+(r.height-h)/2;
 return {x:(event.clientX-left)*1000/w,y:(event.clientY-top)*450/h};}
// Transições visuais compartilhadas pelos controles de mouse, toque e botões.
const prefersReduced=window.matchMedia('(prefers-reduced-motion: reduce)');
let visual={stage:'',angles:[],beamFrom:null,beamTo:null,beamAt:0,enteredAt:0};
const ease=p=>{p=Math.max(0,Math.min(1,p));return p*p*(3-2*p)};
function syncVisual(){
 const key=active?active.id+':'+active.stage:'';
 if(visual.stage===key)return;
 const level=active&&Number.isInteger(active.stage)?currentLevels()[active.stage-1]:null;
 visual={
  stage:key,
  angles:level?level.mirrors.map((m,i)=>({from:initialAngle(mirrors[i]),to:initialAngle(mirrors[i]),start:0})):[],
  beamFrom:null,beamTo:level?trace(level,mirrors):null,
  beamAt:0,enteredAt:0
 };
}
let animation=0,animDeadline=0,boardCtx=null,boardCanvas=null;
function requestBoardFrame(duration=0){
 if(view!=='game'||!active||!boardCanvas?.isConnected)return;
 if(!prefersReduced.matches&&duration>0)animDeadline=Math.max(animDeadline,performance.now()+duration);
 if(!animation)animation=requestAnimationFrame(paintBoard);
}
function paintBoard(t){
 animation=0;
 if(view!=='game'||!active||!boardCanvas?.isConnected||document.hidden)return;
 try{draw(boardCtx,t/1000)}
 catch(err){console.error('Falha ao desenhar o tabuleiro LIGO',err);return}
 if(t<animDeadline&&!prefersReduced.matches)animation=requestAnimationFrame(paintBoard);
}
function rotateMirror(i){
 if(!active||i<0||i>=mirrors.length)return;
 syncVisual();
 const now=performance.now(),angle=visual.angles[i];
 const current=prefersReduced.matches?angle.to:angle.from+(angle.to-angle.from)*ease((now-angle.start)/180);
 visual.beamFrom=visual.beamTo;
 mirrors[i]=!mirrors[i];
 visual.angles[i]={from:current,to:initialAngle(mirrors[i]),start:now};
 visual.beamTo=trace(currentLevels()[active.stage-1],mirrors);
 visual.beamAt=now;
 beep(540,'mirror');
 renderControls();
 requestBoardFrame(220);
}
function drawLoop(){
 cancelAnimationFrame(animation);
 animation=0;animDeadline=0;
 const canvas=document.getElementById('gameboard');if(!canvas||!active)return;
 boardCanvas=canvas;boardCtx=canvas.getContext('2d',{alpha:false})||canvas.getContext('2d');
 if(!boardCtx)return;
 syncVisual();
 canvas.style.touchAction='manipulation';
 canvas.addEventListener('pointerdown',event=>{
  const pt=canvasPoint(event,canvas),list=currentLevels()[active.stage-1].mirrors;
  const i=list.findIndex(m=>Math.hypot(pt.x-(180+m[0]*61),pt.y-(43+m[1]*61))<34);
  if(i>=0){event.preventDefault();rotateMirror(i)}
 });
 requestBoardFrame();
}
mirrorArt.addEventListener('load',()=>requestBoardFrame());
function line(ctx,coords,width,color){ctx.beginPath();coords.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke();}
function drawBeam(ctx,path,alpha,t){
 if(!path||alpha<=.001)return;
 const points=path.points.map(pt=>[180+pt[0]*61,43+pt[1]*61]);
 ctx.save();ctx.globalAlpha=alpha;
 line(ctx,points,19,'rgba(31,167,230,.10)');
 line(ctx,points,9,'rgba(34,211,238,.30)');
 line(ctx,points,3,'#b6f4ff');
 ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
 ctx.strokeStyle='rgba(200,250,255,.24)';ctx.lineWidth=1.5;ctx.setLineDash([13,23]);ctx.lineDashOffset=0;ctx.stroke();ctx.setLineDash([]);
 ctx.restore();
}
function draw(ctx,t){
 syncVisual();
 const now=t*1000,reduced=prefersReduced.matches;
 ctx.clearRect(0,0,1000,450);
 ctx.save();ctx.globalAlpha=1;
 ctx.fillStyle='#0a1528';ctx.fillRect(0,0,1000,450);
 ctx.strokeStyle='rgba(61,113,154,.14)';ctx.lineWidth=1;
 for(let i=20;i<1000;i+=39){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,450);ctx.stroke();}
 for(let j=20;j<450;j+=39){ctx.beginPath();ctx.moveTo(0,j);ctx.lineTo(1000,j);ctx.stroke();}
 ctx.strokeStyle='#32516e';ctx.strokeRect(12,12,976,426);
 const q=currentLevels()[active.stage-1],c=[180,43],sz=61,rx=c[0]+q.receiver[0]*sz,ry=c[1]+q.receiver[1]*sz;
 const success=visual.beamTo?.hit;
 const pulse=0;
 ctx.fillStyle=success?`rgba(36,210,156,${.16+.07*pulse})`:'rgba(33,130,141,.13)';
 ctx.beginPath();ctx.arc(rx,ry,27+(reduced?0:2*pulse),0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#103b4c';ctx.beginPath();ctx.arc(rx,ry,20,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle=success?'#32f5b9':'#67d0ce';ctx.lineWidth=4;ctx.stroke();
 ctx.strokeStyle='#d2fff7';ctx.lineWidth=1;ctx.beginPath();ctx.arc(rx,ry,11,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#32d8b4';ctx.beginPath();ctx.arc(rx,ry,5,0,Math.PI*2);ctx.fill();
 const fade=reduced||!visual.beamFrom?1:ease((now-visual.beamAt)/180);
 if(visual.beamFrom&&fade<1)drawBeam(ctx,visual.beamFrom,1-fade,t);
 drawBeam(ctx,visual.beamTo,fade,t);
 if(visual.beamTo?.blocked){const last=visual.beamTo.points.at(-1),bx=c[0]+last[0]*sz,by=c[1]+last[1]*sz;ctx.fillStyle='rgba(251,191,36,.35)';ctx.beginPath();ctx.arc(bx,by,10,0,Math.PI*2);ctx.fill();}
 q.mirrors.forEach((m,i)=>{
  const [px,py]=[c[0]+m[0]*sz,c[1]+m[1]*sz],a=visual.angles[i];
  const angle=reduced?a.to:a.from+(a.to-a.from)*ease((now-a.start)/180);
  if(mirrorArt.complete&&mirrorArt.naturalWidth){ctx.save();ctx.translate(px,py);ctx.rotate(angle*Math.PI/180);ctx.drawImage(mirrorArt,-29,-29,58,58);ctx.restore();}
  else{ctx.fillStyle='#467995';ctx.beginPath();ctx.arc(px,py,24,0,Math.PI*2);ctx.fill();}
  ctx.fillStyle='#dffaff';ctx.font='bold 11px Arial';ctx.fillText('E'+(i+1),px+15,py+25);
 });
 const ex=c[0]+q.emitter[0]*sz,ey=c[1]+q.emitter[1]*sz;
 ctx.fillStyle='#143b58';ctx.beginPath();ctx.arc(ex,ey,21,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#7ad9ff';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#b9f6ff';ctx.beginPath();ctx.arc(ex,ey,8,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function go(dest,remember=true){
 if(dest===view)return;
 if(remember){navigationHistory.push(view);if(navigationHistory.length>20)navigationHistory.shift();}
 if(view==='science')scienceScrollHistory.length=0;
 if(dest==='home'&&active)resetVisitor();
 view=dest;render();
 if(dest==='ranking')void refreshRanking();
}
function navigateBackPage(){
 const target=navigationHistory.pop()||'home';
 if(target===view){go('home',false);return;}
 go(target,false);
}
function scienceScrollContainer(){return view==='science'?document.querySelector('.app-shell>main'):null;}
function scienceScrollTo(top){
 const scroller=scienceScrollContainer();if(!scroller)return;
 const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 scroller.scrollTo({top:Math.max(0,top),behavior:reduce?'auto':'smooth'});
}
function scienceJump(id){
 if(view!=='science'||!['sci-gabriela','sci-trajetoria','sci-lab','sci-experimento'].includes(id))return;
 const scroller=scienceScrollContainer(),section=document.getElementById(id);
 if(!scroller||!section)return;
 const top=scroller.scrollTop+section.getBoundingClientRect().top-scroller.getBoundingClientRect().top-50;
 scienceScrollHistory.push(scroller.scrollTop);
 if(scienceScrollHistory.length>15)scienceScrollHistory.shift();
 scienceScrollTo(top);
}
function scienceBack(){
 const scroller=scienceScrollContainer();if(!scroller)return;
 if(scienceScrollHistory.length){scienceScrollTo(scienceScrollHistory.pop());return;}
 if(scroller.scrollTop>40){scienceScrollTo(0);return;}
 navigateBackPage();
}
function scienceTop(){
 if(view!=='science')return;
 scienceScrollHistory.length=0;
 scienceScrollTo(0);
}
async function action(type,e){
 if(type==='page-back'){hideModal();navigateBackPage();return;}
 if(type==='science-jump'){scienceJump(e.target.closest('[data-target]')?.dataset.target);return;}
 if(type==='science-back'){scienceBack();return;}
 if(type==='science-top'){scienceTop();return;}
 if(type==='science-step'){
  if(view!=='science')return;
  const selected=e.target.closest('[data-step]')?.dataset.step;
  if(!['1','2','3'].includes(selected))return;
  const demo=document.querySelector('.sci-demo');if(!demo)return;
  demo.dataset.step=selected;
  document.querySelectorAll('.sci-step-btn').forEach(btn=>{const active=btn.dataset.step===selected;btn.classList.toggle('is-active',active);btn.setAttribute('aria-pressed',String(active))});
  const content={
   '1':'O laser atinge um divisor de feixe, que envia a luz por dois braços perpendiculares.',
   '2':'Espelhos nos extremos refletem os feixes de volta. O LIGO usa sistemas ópticos de altíssima precisão.',
   '3':'Quando os feixes se reencontram, mudanças no padrão de interferência podem indicar uma onda gravitacional.'
  };
  document.getElementById('sci-step-description').textContent=content[selected];
  return;
 }
 if(type==='mobile-menu'){document.querySelector('.nav-links')?.classList.toggle('open');return;}if(type==='home'||type==='ranking'||type==='science'){hideModal();go(type);return}
 if(type==='play'){resetVisitor();showModal('register');return}
 if(type==='settings'){showModal('settings');return}if(type==='close'){hideModal();return}
 if(type==='theme'){theme=theme==='dark'?'light':'dark';store.setItem('ligo_theme',theme);document.documentElement.dataset.theme=theme;showModal('settings');return}
 if(type==='sound'){sound=!sound;store.setItem('ligo_sound',String(sound));showModal('settings');beep();return}
 if(type==='select-difficulty'){
   const level=e.target.closest('[data-level]')?.dataset.level;
   if(!Object.hasOwn(DIFFICULTY_LABELS,level))return;
   selectedDifficulty=level;
   document.querySelectorAll('.difficulty-choice').forEach(btn=>{const on=btn.dataset.level===level;btn.classList.toggle('selected',on);btn.setAttribute('aria-checked',String(on))});
   return;
 }
 if(type==='save-player'){
   if(busy)return;
   const first=document.getElementById('first-name')?.value.normalize('NFC').trim().replace(/\s+/g,' ')||'';
   const last=document.getElementById('last-name')?.value.normalize('NFC').trim().replace(/\s+/g,' ')||'';
   const regex=/^[\p{L}][\p{L}'-]*(?: [\p{L}][\p{L}'-]*)*$/u;
   const error=document.getElementById('modal-error');
   if(first.length<2||first.length>35||last.length<2||last.length>45||first.length+last.length+1>80||!regex.test(first)||!regex.test(last)){
     error.textContent='Preencha nome e sobrenome com pelo menos duas letras em cada campo.';return;
   }
   busy=true;const entry=preparePlayerToken(first+' '+last);playerToken=entry.token;
   try{const d=await api('register',{first_name:first,last_name:last});player=d.player.nickname;rememberPlayer(player,entry.token);rankDifficulty=selectedDifficulty;showModal('tutorial')}
   catch(e){playerToken='';if(error)error.textContent=errorLabel(e)}
   finally{busy=false}
   return;
 }
 if(type==='begin'){void begin();return}
 if(type==='restart'){resetVisitor();showModal('register');return}
 if(type==='refresh-ranking'){void refreshRanking();return}
 if(type==='rank-level'){const level=e.target.closest('[data-level]')?.dataset.level;if(Object.hasOwn(DIFFICULTY_LABELS,level)&&rankDifficulty!==level){rankDifficulty=level;board={ranking:[],me:null};rankingError='Carregando...';render();void refreshRanking()}return}
 if(!active)return;
 if(type==='mirror'){const btn=e.target.closest('button'),i=Number(btn?.dataset.i);if(Number.isInteger(i))rotateMirror(i);return}
 if(type==='confirm') {if(trace(currentLevels()[active.stage-1],mirrors).hit)void advanceStage();}

}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button)action(button.dataset.action,e)});
setInterval(()=>{if(view==='game'&&active){const timer=document.getElementById('timer');if(timer)timer.textContent=format(Date.now()-active.startedAt)}},160);
setInterval(()=>{if(view==='ranking')void refreshRanking()},12000);
render();
